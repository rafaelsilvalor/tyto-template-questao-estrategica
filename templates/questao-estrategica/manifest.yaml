name: questao-estrategica
version: 0.2.0
brand: marinho
description: One exam question as a 1080×1350 carousel — a cover naming the exam, the statement with its options, the answer with its explanation, and a sign-off.
# Every face the slides set is declared, so the plugin's process can measure them (Tyto ADR 0048).
# CircularXX is licensed: it crosses only under the manifest's `font:CircularXX`, approved at
# install. `tests/faces.test.ts` holds this list equal to the faces the examples draw.
faces:
  - { family: CircularXX, weight: 300 }
  - { family: CircularXX, weight: 400 }
  - { family: CircularXX, weight: 500 }
  - { family: CircularXX, weight: 700 }
  - { family: CircularXX, weight: 900 }
fonts:
  CircularXX: { alternatives: [Inter, Manrope, DM Sans] }
formats: [grid]
slots:
  # The words over the cover's rule. Optional: without it the template draws its default.
  titulo: { type: rich-text, max: 40 }
  # The cover's picture, full bleed under the words. In the frontmatter: `fundo: ./fundo.png`.
  # Without it the cover is the deep colour, flat.
  fundo: { type: image }
  # The pictures the middle slides show (a chart, a formula), each in a frame as tall as its
  # proportion makes it. In the frontmatter: `imagem-1: ./figura.png`; a statement or an answer
  # shows it with `::lamina {imagem: 1, proporcao: 2x1}`.
  imagem-1: { type: image }
  imagem-2: { type: image }
  imagem-3: { type: image }
  imagem-4: { type: image }
  # The house's seal art, 1080 × 140, glued to the foot of the last slide (TYTO-201): the
  # number at the foot rises by it. In the frontmatter: `selo: ./selo.png`.
  selo: { type: image }
  # The sign-off slide's words: its first line the title, the rest the paragraph. Optional.
  fecho: { type: rich-text, max: 160 }
  # One slide each, in order. The cover is `::lamina {capa}` (its lines name the exam), the
  # answer `::lamina {resposta}` (its first line the answer, the rest the explanation) and the
  # sign-off `::lamina {fecho}`, empty. An unmarked `::lamina` is the statement: its lines up to
  # the first `A)` are the statement, and every `X) ...` line is one option. A statement or an
  # explanation too long for one slide goes on in the next one, marked `{continua}`, which draws
  # no label. `max` counts slides.
  lamina: { type: rich-text, repeat: true, min: 1, max: 10 }
adjustments:
  capa: { type: flag, applies: [lamina] }
  resposta: { type: flag, applies: [lamina] }
  fecho: { type: flag, applies: [lamina] }
  continua: { type: flag, applies: [lamina] }
  # Which `imagem-N` a middle slide shows, and its shape, width x height: Tyto hands a template
  # no image's size, so the slide says it.
  imagem: { type: enum, values: ['1', '2', '3', '4'], applies: [lamina] }
  proporcao:
    {
      type: enum,
      values: [3x1, 5x2, 7x3, 2x1, 16x9, 3x2, 4x3, 1x1],
      default: 2x1,
      applies: [lamina],
    }
# What a configuration may change (Tyto ADR 0153): the colours and the cover's type sizes. Each default is the reference
# art's, and `tests/values.test.ts` pins them equal to the ones the code falls back to. The
# accent is the reference's, not the brand kit's: the kit's marinho accent is another blue.
values:
  # The cover's colour where the brief gives it no picture.
  deep: { type: color, default: '#00153d' }
  # The cover's title, its rule and its slide number.
  accent: { type: color, default: '#1d9ad5' }
  # The cover's other words, its arrow and its logo.
  on-deep: { type: color, default: '#ffffff' }
  # The paper of every slide but the cover.
  paper: { type: color, default: '#ffffff' }
  # The headings, the options' letters, the logo, the numbers, the arrows and the image's frame.
  title-ink: { type: color, default: '#081c3d' }
  # The statement, the options and the explanation.
  body-ink: { type: color, default: '#4d4d4d' }
  # The sign-off's paragraph.
  closing-ink: { type: color, default: '#676767' }
  # The like bar under the sign-off, and its icons.
  bar-fill: { type: color, default: '#e2e2e2' }
  bar-ink: { type: color, default: '#4c4c4c' }
  # The cover's exam lines are set at the largest size between these that keeps them in their
  # room, so a short title grows and a long one shrinks. Below the floor it overflows, reported.
  exam-floor: { type: length, default: 56, min: 32, max: 112 }
  exam-ceiling: { type: length, default: 112, min: 56, max: 160 }
  # The statement and the answer's explanation are sized the same way, each between its floor
  # and ceiling: the largest size whose words (and image) end over the arrow. The options follow
  # the statement, at the reference's 37.5 to 40.
  statement-floor: { type: length, default: 28, min: 20, max: 48 }
  statement-ceiling: { type: length, default: 48, min: 28, max: 72 }
  explanation-floor: { type: length, default: 32, min: 24, max: 76 }
  explanation-ceiling: { type: length, default: 76, min: 40, max: 112 }
